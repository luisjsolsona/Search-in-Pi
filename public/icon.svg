<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081510"/>
      <stop offset="100%" stop-color="#050f0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="42%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="155"/>
    </clipPath>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)"/>
  <rect width="512" height="512" rx="80" ry="80" fill="url(#glow)"/>

  <!-- Borde exterior -->
  <rect width="512" height="512" rx="80" ry="80"
        fill="none" stroke="#00ff8830" stroke-width="3"/>

  <!-- Círculo de la lupa — aro exterior grueso -->
  <circle cx="200" cy="200" r="155"
          fill="none" stroke="#00ff88" stroke-width="22"
          filter="url(#bloom)"/>

  <!-- Brillo interior del cristal -->
  <circle cx="200" cy="200" r="144"
          fill="#050f0a" fill-opacity="0.92"/>
  <circle cx="200" cy="200" r="144"
          fill="none" stroke="#00ff8818" stroke-width="1"/>

  <!-- Reflejo del cristal -->
  <path d="M 110 130 Q 140 90 190 82"
        fill="none" stroke="#00ff8845" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Scanlines dentro del cristal -->
  <g clip-path="url(#circle-clip)" opacity="0.07">
    <line x1="50"  y1="80"  x2="350" y2="80"  stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="100" x2="350" y2="100" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="120" x2="350" y2="120" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="140" x2="350" y2="140" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="160" x2="350" y2="160" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="180" x2="350" y2="180" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="200" x2="350" y2="200" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="220" x2="350" y2="220" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="240" x2="350" y2="240" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="260" x2="350" y2="260" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="280" x2="350" y2="280" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="300" x2="350" y2="300" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="50"  y1="320" x2="350" y2="320" stroke="#00ff88" stroke-width="1.5"/>
  </g>

  <!-- Símbolo π centrado en la lupa -->
  <!-- Barra horizontal superior -->
  <rect x="130" y="138" width="142" height="16" rx="8"
        fill="#00ff88" filter="url(#glow-text)"/>
  <!-- Pata izquierda -->
  <path d="M 152 154 Q 148 220 138 268"
        fill="none" stroke="#00ff88" stroke-width="16"
        stroke-linecap="round"/>
  <!-- Pata derecha (más larga, curvada ligeramente) -->
  <path d="M 228 154 Q 228 220 232 268"
        fill="none" stroke="#00ff88" stroke-width="16"
        stroke-linecap="round"/>

  <!-- Mango de la lupa — rotado 45° hacia abajo-derecha -->
  <line x1="323" y1="323" x2="442" y2="442"
        stroke="#00ff88" stroke-width="40"
        stroke-linecap="round"
        filter="url(#bloom)"/>
  <!-- Conector mango-aro -->
  <line x1="311" y1="311" x2="333" y2="333"
        stroke="#00ff8888" stroke-width="28"
        stroke-linecap="round"/>

  <!-- Pequeños dígitos de π en el borde del cristal (decorativo) -->
  <text x="200" y="365" text-anchor="middle"
        font-family="monospace" font-size="13" fill="#00ff8855"
        letter-spacing="2">3.14159265</text>
</svg>
