<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Search in π</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --g:#00ff88;--gd:#00cc6a;--y:#ffdd00;--r:#ff4466;--b:#00ccff;
  --bg:#050f0a;--bg2:#081510;--brd:#00ff8820;--txt:#a0ffd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{
  background:var(--bg);color:var(--txt);font-family:'Share Tech Mono',monospace;
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:900;opacity:.28;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E")
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:899;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,.01) 2px,rgba(0,255,136,.01) 4px)
}

/* ═══ HEADER ═══ */
header{
  flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--brd);
  padding:10px 14px 8px;display:flex;align-items:center;gap:10px;
}
.logo-wrap{flex-shrink:0;width:clamp(30px,7vw,44px);height:clamp(30px,7vw,44px)}
.logo-wrap img{width:100%;height:100%;display:block}
.hinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.htitle{
  font-family:'Orbitron',sans-serif;color:var(--gd);text-transform:uppercase;
  letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:clamp(.42rem,.06rem + 1.5vw,.6rem);
}
.hsub{color:#336655;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:clamp(.5rem,.06rem + 1.2vw,.64rem);}
.spill{flex-shrink:0;display:flex;align-items:center;gap:7px;
  font-size:clamp(.5rem,.06rem + 1.1vw,.64rem);color:var(--gd)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 7px var(--y);
  animation:blink 1s ease-in-out infinite;transition:background .3s,box-shadow .3s;flex-shrink:0}
.dot.ok{background:var(--g);box-shadow:0 0 7px var(--g);animation:none}
.dot.go{background:var(--b);box-shadow:0 0 7px var(--b)}
.dot.err{background:var(--r);box-shadow:0 0 7px var(--r);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}

/* ═══ SEARCH ZONE ═══ */
.sz{
  flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--brd);
  padding:10px 14px 8px;display:flex;flex-direction:column;align-items:stretch;gap:7px;
}
.sr{display:flex;gap:6px;align-items:stretch;width:100%}
.slbl{display:none;font-family:'Orbitron',sans-serif;font-size:.5rem;
  color:var(--gd);letter-spacing:2px;white-space:nowrap;align-self:center}
input[type=text]{
  flex:1;min-width:0;background:#000;border:1px solid var(--gd);color:var(--g);
  font-family:'Share Tech Mono',monospace;padding:10px 12px;outline:none;
  letter-spacing:3px;border-radius:2px;transition:border-color .2s,box-shadow .2s;
  font-size:clamp(.88rem,.38rem + 2.1vw,1.2rem);-webkit-appearance:none;appearance:none;
}
input:focus{border-color:var(--g);box-shadow:0 0 10px var(--gd),inset 0 0 6px rgba(0,255,136,.04)}
input::placeholder{color:#1a4433;letter-spacing:1px}
.bp,.bo{
  flex-shrink:0;border-radius:2px;cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:700;
  white-space:nowrap;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .15s,box-shadow .15s,color .15s;
}
.bp{background:var(--g);color:#000;border:none;
  font-size:clamp(.53rem,.18rem + 1.3vw,.64rem);letter-spacing:1px;padding:0 14px}
.bp:active,.bp:hover{background:#fff;box-shadow:0 0 14px var(--g)}
.bp:disabled{background:#1a3328;color:#2a5540;cursor:default;box-shadow:none}
.bo{background:transparent;border:1px solid var(--b);color:var(--b);
  font-size:clamp(.48rem,.16rem + 1.1vw,.58rem);letter-spacing:1px;padding:0 10px}
.bo:active:not(:disabled),.bo:hover:not(:disabled){background:var(--b);color:#000}
.bo:disabled{opacity:.22;cursor:default}

/* ═══ PI DISPLAY ═══ */
.pc{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:10px 12px 0;background:var(--bg);
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.pc::-webkit-scrollbar{width:4px}
.pc::-webkit-scrollbar-track{background:#050f0a}
.pc::-webkit-scrollbar-thumb{background:#00ff8828;border-radius:3px}

/* TEXTO DE π — continuo, sin grupos, anchura completa */
#pt{
  font-size:clamp(.65rem,.18rem + 1.5vw,.82rem);
  line-height:1.9;
  word-break:break-all;     /* rompe donde haga falta para ocupar todo el ancho */
  white-space:normal;       /* NO pre-wrap: fluye naturalmente */
  color:#3a8a60;
  user-select:text;
  width:100%;
}
mark.hi{background:var(--y);color:#000;border-radius:2px;padding:0 1px}
mark.hi.cur{background:var(--r);color:#fff;box-shadow:0 0 10px var(--r)}

/* banner inferior */
#bbanner{
  margin:10px 0 12px;padding:9px 12px;border-radius:3px;
  border:1px solid #1a3344;background:rgba(0,100,150,.05);
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
}
.bb-info{font-size:clamp(.56rem,.1rem + 1vw,.64rem);color:#4488aa;flex:1;line-height:1.5}
.bb-info strong{color:#aaddff}

/* ═══ FOOTER ═══ */
footer{
  flex-shrink:0;background:var(--bg2);border-top:1px solid var(--brd);
  padding:5px 12px;padding-bottom:calc(5px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;
  font-size:clamp(.5rem,.06rem + 1vw,.6rem);color:#1a5533;
}
footer b{color:#336644}
.fw{flex:1;min-width:30px;height:3px;background:#0a2a1a;border-radius:2px;overflow:hidden}
.fb2{height:100%;background:var(--g);border-radius:2px;transition:width .5s;width:0%}
.fhide{display:none}

/* ═══ MODAL: BUSCANDO ═══ */
#modal-search{
  position:fixed;inset:0;z-index:1000;
  background:rgba(5,15,10,.92);backdrop-filter:blur(6px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#modal-search.show{display:flex}
.ms-ring{
  width:80px;height:80px;border-radius:50%;
  border:4px solid #0a2a1a;border-top-color:var(--b);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ms-pi{
  font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;
  color:var(--g);text-shadow:0 0 20px var(--g),0 0 40px var(--gd);
  animation:pulse-pi 1.2s ease-in-out infinite;
}
@keyframes pulse-pi{0%,100%{text-shadow:0 0 20px var(--g),0 0 40px var(--gd)}50%{text-shadow:0 0 40px var(--g),0 0 80px var(--gd),0 0 120px #00ff8840}}
.ms-label{
  font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,.3rem + 1.5vw,.95rem);
  color:var(--b);letter-spacing:3px;text-align:center;
}
.ms-detail{font-size:clamp(.58rem,.2rem + 1vw,.72rem);color:#336655;letter-spacing:1px;text-align:center}
.ms-bar-wrap{width:min(320px,80vw);height:5px;background:#0a2a1a;border-radius:3px;overflow:hidden}
.ms-bar{height:100%;background:var(--b);border-radius:3px;transition:width .4s;width:5%}

/* ═══ MODAL: RESULTADOS ═══ */
#modal-result{
  position:fixed;inset:0;z-index:1001;
  background:rgba(3,10,6,.95);backdrop-filter:blur(8px);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
}
#modal-result.show{display:flex}
.mr-box{
  background:#081510;border:1px solid var(--g);border-radius:8px;
  width:100%;max-width:640px;max-height:90dvh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 40px rgba(0,255,136,.15);
}
.mr-head{
  padding:18px 20px 14px;border-bottom:1px solid #00ff8820;
  display:flex;align-items:center;gap:14px;flex-shrink:0;
}
.mr-pi{
  font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;
  color:var(--g);text-shadow:0 0 16px var(--g);line-height:1;flex-shrink:0;
}
.mr-title-wrap{flex:1;min-width:0}
.mr-title{
  font-family:'Orbitron',sans-serif;font-size:clamp(.5rem,.15rem + 1.4vw,.75rem);
  color:var(--g);letter-spacing:2px;text-transform:uppercase;
}
.mr-q{
  font-family:'Orbitron',sans-serif;font-size:clamp(.8rem,.3rem + 2.2vw,1.4rem);
  color:var(--y);letter-spacing:6px;font-weight:700;margin-top:4px;
  text-shadow:0 0 12px var(--y);
}
.mr-close{
  flex-shrink:0;background:transparent;border:1px solid #336644;color:#336644;
  font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1px;
  padding:8px 12px;cursor:pointer;border-radius:2px;min-height:36px;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.mr-close:hover,.mr-close:active{border-color:var(--r);color:var(--r)}

.mr-stats{
  padding:16px 20px;border-bottom:1px solid #00ff8815;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;flex-shrink:0;
}
.mr-stat{display:flex;flex-direction:column;gap:3px}
.mr-stat-label{font-size:clamp(.5rem,.12rem + .9vw,.6rem);color:#336655;letter-spacing:1px;text-transform:uppercase}
.mr-stat-val{
  font-family:'Orbitron',sans-serif;font-size:clamp(.8rem,.3rem + 1.8vw,1.1rem);
  font-weight:700;letter-spacing:1px;
}
.mr-stat-val.green{color:var(--g);text-shadow:0 0 10px var(--g)}
.mr-stat-val.yellow{color:var(--y);text-shadow:0 0 10px var(--y)}
.mr-stat-val.blue{color:var(--b);text-shadow:0 0 10px var(--b)}
.mr-stat-val.red{color:var(--r);text-shadow:0 0 10px var(--r)}

.mr-list-head{
  padding:10px 20px 6px;
  font-size:clamp(.5rem,.1rem + .9vw,.6rem);color:#336655;letter-spacing:1px;
  flex-shrink:0;
}
.mr-list{
  flex:1;overflow-y:auto;padding:0 20px 16px;
  display:flex;flex-direction:column;gap:6px;
  -webkit-overflow-scrolling:touch;
}
.mr-list::-webkit-scrollbar{width:4px}
.mr-list::-webkit-scrollbar-track{background:#050f0a}
.mr-list::-webkit-scrollbar-thumb{background:#00ff8830;border-radius:3px}

.mr-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:3px;
  background:#050f0a;border:1px solid #0a2a1a;
  cursor:pointer;transition:border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.mr-item:hover,.mr-item:active{border-color:var(--g)}
.mr-item.active{border-color:var(--r);background:#1a0408}
.mr-item-n{
  font-family:'Orbitron',sans-serif;font-size:.58rem;
  color:#336644;min-width:28px;text-align:right;
}
.mr-item-pos{
  font-size:clamp(.65rem,.2rem + 1.2vw,.8rem);color:var(--g);
  font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:1px;
}
.mr-item-ctx{
  flex:1;font-size:clamp(.6rem,.18rem + 1vw,.72rem);color:#3a5a48;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mr-item-ctx mark{background:var(--y);color:#000;border-radius:1px;padding:0 1px}
.mr-item-ctx mark.cur{background:var(--r);color:#fff}
.mr-nav{
  padding:12px 20px;border-top:1px solid #00ff8815;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;
}
.mr-nav-btn{
  background:transparent;border:1px solid var(--gd);color:var(--gd);
  font-family:'Share Tech Mono',monospace;font-size:.75rem;
  padding:8px 16px;cursor:pointer;border-radius:2px;min-height:38px;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.mr-nav-btn:hover:not(:disabled),.mr-nav-btn:active:not(:disabled){border-color:var(--g);color:var(--g)}
.mr-nav-btn:disabled{opacity:.2;cursor:default}
.mr-nav-info{color:var(--gd);font-size:.7rem;text-align:center}

/* BOTÓN EXPAND */
.btn-expand{
  background:transparent;border:1px solid var(--b);color:var(--b);
  font-family:'Orbitron',sans-serif;font-size:.52rem;font-weight:700;
  letter-spacing:1px;padding:5px 9px;cursor:pointer;border-radius:2px;
  min-height:32px;transition:all .15s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.btn-expand:hover:not(:disabled),.btn-expand:active:not(:disabled){background:var(--b);color:#000}
.btn-expand:disabled{opacity:.22;cursor:default}
.btn-expand.expanding{border-color:var(--y);color:var(--y);animation:blink .7s ease-in-out infinite}
.btn-expand-max{border-color:var(--r)!important;color:var(--r)!important}
.btn-expand-max:hover:not(:disabled),.btn-expand-max:active:not(:disabled){background:var(--r)!important;color:#000!important}

/* MODAL EXPANSIÓN */
#modal-expand{
  position:fixed;inset:0;z-index:1002;
  background:rgba(5,15,10,.93);backdrop-filter:blur(8px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#modal-expand.show{display:flex}
.me-box{
  background:#081510;border:1px solid var(--b);border-radius:8px;
  padding:30px 32px;width:min(440px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  box-shadow:0 0 40px rgba(0,204,255,.15);
}
.me-title{font-family:'Orbitron',sans-serif;font-size:clamp(.65rem,.2rem+1.4vw,.85rem);
  color:var(--b);letter-spacing:3px;text-align:center}
.me-from-to{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.me-num{font-family:'Orbitron',sans-serif;font-size:clamp(1rem,.4rem+2vw,1.4rem);
  font-weight:700;text-align:center}
.me-num.from{color:#336655}.me-num.to{color:var(--g);text-shadow:0 0 12px var(--g)}
.me-arrow{color:var(--b);font-size:1.4rem}
.me-ring{width:60px;height:60px;border-radius:50%;
  border:3px solid #0a2a1a;border-top-color:var(--b);
  animation:spin .8s linear infinite}
.me-detail{font-size:clamp(.58rem,.15rem+1vw,.7rem);color:#336655;
  letter-spacing:1px;text-align:center;line-height:1.6}
.me-bar-wrap{width:100%;height:4px;background:#0a2a1a;border-radius:2px;overflow:hidden}
.me-bar{height:100%;background:var(--b);border-radius:2px;transition:width .4s;width:3%}
.me-cancel{background:transparent;border:1px solid #336644;color:#336644;
  font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:1px;
  padding:7px 14px;cursor:pointer;border-radius:2px;transition:all .15s}
.me-cancel:hover{border-color:var(--r);color:var(--r)}

/* ═══ BREAKPOINTS ═══ */
@media(min-width:480px){.slbl{display:flex}.fhide{display:inline}footer{gap:10px}}
@media(min-width:768px){
  header{padding:12px 22px 10px;gap:14px}.sz{padding:12px 22px 10px;gap:9px}.sr{gap:8px}
  input{padding:10px 14px;letter-spacing:4px}input::placeholder{letter-spacing:2px}
  .bp{letter-spacing:2px;padding:0 16px}.bo{letter-spacing:2px;padding:0 12px}
  .pc{padding:14px 20px 0}footer{padding:5px 20px;gap:14px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo-wrap" onclick="scrollTop()" title="Ir al inicio" style="cursor:pointer;text-decoration:none"><img src="/icon.svg" alt="Search in Pi"></a>
  <div class="hinfo">
    <div class="htitle">Search in π</div>
    <div class="hsub" id="hsub">conectando…</div>
  </div>
  <div class="spill">
    <button class="btn-expand" id="btn-expand" onclick="expandPi()" title="Calcular 500.000 decimales más en el servidor" disabled>
      +500K
    </button>
    <button class="btn-expand btn-expand-max" id="btn-expand-max" onclick="expandPiMax()" title="Calcular hasta 50.000.000 decimales de una vez" disabled>
      <span id="btn-max-label">+50M</span>
    </button>
    <div class="dot" id="dot"></div><span id="stxt">…</span>
  </div>
</header>

<!-- BÚSQUEDA -->
<div class="sz">
  <div class="sr">
    <span class="slbl">BUSCAR EN π</span>
    <input type="text" id="q" placeholder="Ej: 271828  ó  tu fecha de nacimiento"
           maxlength="20" autocomplete="off" spellcheck="false" inputmode="numeric" disabled>
    <button class="bp" id="bbuscar" disabled onclick="buscar()">BUSCAR</button>
  </div>
</div>

<!-- DISPLAY DE π -->
<div class="pc" id="pc">
  <div id="pt"><span style="color:#1a5533">▌ cargando π…</span></div>
  <div id="bbanner"></div>
</div>

<!-- FOOTER -->
<footer>
  <b>DEC:</b><span id="fc">—</span>
  <span class="fhide">|</span><span class="fhide"><b>SERVIDOR:</b><span id="fmax">—</span></span>
  <div class="fw"><div class="fb2" id="fbar"></div></div>
  <span id="fpct">0%</span>
</footer>

<!-- MODAL: BUSCANDO EN π -->
<div id="modal-search">
  <div class="ms-pi">π</div>
  <div class="ms-ring"></div>
  <div class="ms-label" id="ms-label">BUSCANDO EN π</div>
  <div class="ms-detail" id="ms-detail">Iniciando búsqueda…</div>
  <div class="ms-bar-wrap"><div class="ms-bar" id="ms-bar"></div></div>
</div>

<!-- MODAL: RESULTADOS -->
<div id="modal-result">
  <div class="mr-box">
    <div class="mr-head">
      <div class="mr-pi">π</div>
      <div class="mr-title-wrap">
        <div class="mr-title">Resultado de búsqueda</div>
        <div class="mr-q" id="mr-q">—</div>
      </div>
      <button class="mr-close" onclick="closeResult()">✕ CERRAR</button>
    </div>
    <div class="mr-stats" id="mr-stats"></div>
    <div class="mr-list-head" id="mr-list-head"></div>
    <div class="mr-list" id="mr-list"></div>
    <div class="mr-nav">
      <button class="mr-nav-btn" id="mr-prev" onclick="navResult(-1)" disabled>◀ ANTERIOR</button>
      <div class="mr-nav-info" id="mr-nav-info"></div>
      <button class="mr-nav-btn" id="mr-next" onclick="navResult(1)" disabled>SIGUIENTE ▶</button>
    </div>
  </div>
</div>

<!-- MODAL: EXPANDIENDO π -->
<div id="modal-expand">
  <div class="me-box">
    <div class="me-title">AMPLIANDO π</div>
    <div class="me-from-to">
      <div>
        <div style="font-size:.55rem;color:#336655;letter-spacing:1px;margin-bottom:4px">ACTUAL</div>
        <div class="me-num from" id="me-from">—</div>
      </div>
      <div class="me-arrow">→</div>
      <div>
        <div style="font-size:.55rem;color:#336655;letter-spacing:1px;margin-bottom:4px">NUEVO LÍMITE</div>
        <div class="me-num to" id="me-to">—</div>
      </div>
    </div>
    <div class="me-ring"></div>
    <div class="me-detail" id="me-detail">Calculando con algoritmo Chudnovsky…<br>El servidor continuará disponible durante el cálculo.</div>
    <div class="me-bar-wrap"><div class="me-bar" id="me-bar"></div></div>
    <button class="me-cancel" onclick="closeExpandModal()">CERRAR (el cálculo sigue en segundo plano)</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════════ */
const INIT_COUNT  = 1_000_000;
const CHUNK_COUNT = 1_000_000;

/* ════════════════════════════════════════════════
   ESTADO
════════════════════════════════════════════════ */
let piDec      = '';
let loaded     = 0;
let serverMax  = 0;
let serverMode = false;
let busy           = false;
let serverHardLimit = 50_000_000; // se actualiza desde /api/status
let serverRamGB     = null;
let matches    = [];      // posiciones 1-based
let mIdx       = 0;       // índice activo en modal
let lastQ      = '';
let lastMS     = null;
let progTimer  = null;
let calcT0     = 0;
let worker     = null;

/* ════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════ */
const $    = id => document.getElementById(id);
const fn   = n  => n.toLocaleString('es');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setStatus(cls, txt) {
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  $('stxt').textContent = txt;
}
function updateFooter() {
  const pct = Math.min(100, Math.round(loaded / serverMax * 100));
  $('fc').textContent   = ' ' + fn(loaded);
  $('fmax').textContent = ' ' + fn(serverMax) + ' dec.';
  $('fbar').style.width = pct + '%';
  $('fpct').textContent = pct + '%';
  $('hsub').textContent = `${fn(loaded)} / ${fn(serverMax)} decimales`;
}
function activateUI() {
  $('q').disabled      = false;
  $('bbuscar').disabled = false;
  setStatus('ok', 'LISTO');
  // Habilitar botón expand solo en modo servidor
  if (serverMode) {
    $('btn-expand').disabled     = serverMax >= serverHardLimit;
    $('btn-expand-max').disabled = serverMax >= serverHardLimit;
    updateMaxBtn();
  }
  $('q').focus();
}

let msBarTimer = null;
function showSearchModal(label, detail) {
  $('ms-label').textContent  = label  || 'BUSCANDO EN π';
  $('ms-detail').textContent = detail || '';
  $('ms-bar').style.width = '5%';
  $('modal-search').classList.add('show');
  let pct = 5;
  clearInterval(msBarTimer);
  msBarTimer = setInterval(() => {
    pct = Math.min(92, pct + (pct < 60 ? 1.2 : 0.15));
    $('ms-bar').style.width = pct + '%';
  }, 300);
}
function updateSearchModal(detail) {
  $('ms-detail').textContent = detail;
}
function hideSearchModal() {
  clearInterval(msBarTimer);
  $('ms-bar').style.width = '100%';
  setTimeout(() => $('modal-search').classList.remove('show'), 300);
}

/* ════════════════════════════════════════════════
   MODAL RESULTADOS
════════════════════════════════════════════════ */
function showResult(q, positions, searchedDec) {
  mIdx = 0;
  $('mr-q').textContent = `«${q}»`;

  // Stats
  const found  = positions.length;
  const first  = found > 0 ? positions[0] : null;
  const last   = found > 0 ? positions[found - 1] : null;
  const freq   = found > 0 ? (found / searchedDec * Math.pow(10, q.length)).toFixed(2) : '—';

  $('mr-stats').innerHTML = `
    <div class="mr-stat">
      <div class="mr-stat-label">Apariciones</div>
      <div class="mr-stat-val ${found > 0 ? 'green' : 'red'}">${found > 0 ? fn(found) : 'NO ENCONTRADO'}</div>
    </div>
    <div class="mr-stat">
      <div class="mr-stat-label">Decimales buscados</div>
      <div class="mr-stat-val blue">${fn(searchedDec)}</div>
    </div>
    ${first !== null ? `
    <div class="mr-stat">
      <div class="mr-stat-label">Primera posición</div>
      <div class="mr-stat-val yellow">dec. ${fn(first)}</div>
    </div>
    <div class="mr-stat">
      <div class="mr-stat-label">Última posición</div>
      <div class="mr-stat-val yellow">dec. ${fn(last)}</div>
    </div>` : ''}
  `;

  // Lista de posiciones
  const SHOW_MAX = 200;
  const shown = positions.slice(0, SHOW_MAX);
  $('mr-list-head').textContent = found > 0
    ? `Posiciones${positions.length > SHOW_MAX ? ` (mostrando primeras ${SHOW_MAX})` : ''} — pulsa para navegar`
    : '';

  if (found === 0) {
    $('mr-list').innerHTML = `
      <div style="padding:24px;text-align:center;color:#336644;font-size:.8rem;letter-spacing:1px">
        «${q}» no aparece en los ${fn(searchedDec)} decimales buscados
      </div>`;
  } else {
    $('mr-list').innerHTML = shown.map((pos, i) => {
      const ctx = getContext(pos - 1, q.length);
      return `<div class="mr-item${i === 0 ? ' active' : ''}" onclick="selectResult(${i})" id="mri-${i}">
        <span class="mr-item-n">#${i + 1}</span>
        <span class="mr-item-pos">dec. ${fn(pos)}</span>
        <span class="mr-item-ctx">${ctx}</span>
      </div>`;
    }).join('');
  }

  // Nav
  updateResultNav(found);
  $('modal-result').classList.add('show');
}

function getContext(startIdx, qLen) {
  // startIdx es índice en piDec (0-based), qLen = longitud query
  const PRE = 8, POST = 8;
  const from = Math.max(0, startIdx - PRE);
  const to   = Math.min(piDec.length, startIdx + qLen + POST);
  const before = piDec.slice(from, startIdx);
  const match  = piDec.slice(startIdx, startIdx + qLen);
  const after  = piDec.slice(startIdx + qLen, to);
  const prefix = from > 0 ? '…' : '';
  const suffix = to < piDec.length ? '…' : '';
  return `${prefix}${before}<mark>${match}</mark>${after}${suffix}`;
}

function selectResult(i) {
  mIdx = i;
  // Desactivar todos, activar el seleccionado
  document.querySelectorAll('.mr-item').forEach((el, j) => {
    el.classList.toggle('active', j === i);
  });
  updateResultNav(matches.length);
  // Scroll al item en el modal
  const item = $(`mri-${i}`);
  if (item) item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  // Scroll al texto en el display de π
  closeResult();
  setTimeout(() => {
    buildMS(lastQ);
    renderText(lastMS, mIdx);
    scrollCur();
  }, 100);
}

function navResult(dir) {
  const newIdx = Math.max(0, Math.min(matches.length - 1, mIdx + dir));
  selectResult(newIdx);
}

function updateResultNav(total) {
  $('mr-prev').disabled = mIdx === 0;
  $('mr-next').disabled = mIdx >= Math.min(total, 200) - 1;
  $('mr-nav-info').textContent = total > 0
    ? `${fn(mIdx + 1)} de ${fn(Math.min(total, 200))}${total > 200 ? ` (${fn(total)} totales)` : ''}`
    : '';
}

function closeResult() {
  $('modal-result').classList.remove('show');
}

// Cerrar con ESC o clic fuera
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeResult(); });
$('modal-result').addEventListener('click', e => {
  if (e.target === $('modal-result')) closeResult();
});

/* ════════════════════════════════════════════════
   RENDER DEL TEXTO DE π (continuo, sin grupos)
════════════════════════════════════════════════ */
function buildPiText(dec, ms, ai) {
  // Sin grupos: texto plano continuo, solo "3." al inicio
  // Las marks se insertan donde corresponda
  const hasM = ms && ms.size > 0;
  if (!hasM) return '3.' + dec;

  const parts = ['3.'];
  let i = 0, len = dec.length;
  while (i < len) {
    if (ms.has(i)) {
      const { end, mi } = ms.get(i);
      const cls = mi === ai ? 'hi cur' : 'hi';
      const mEnd = Math.min(end, len);
      parts.push(`<mark class="${cls}">${dec.slice(i, mEnd)}</mark>`);
      i = mEnd;
    } else {
      // Avanzar hasta la próxima mark o el final
      let next = len;
      for (const [k] of ms) { if (k > i && k < next) next = k; }
      parts.push(dec.slice(i, next));
      i = next;
    }
  }
  return parts.join('');
}

function renderText(ms, ai) {
  const el = $('pt');
  if (ms && ms.size > 0) {
    el.innerHTML = buildPiText(piDec, ms, ai ?? mIdx);
  } else {
    el.textContent = '3.' + piDec;
  }
}

function buildMS(q) {
  const ms = new Map();
  matches.forEach((pos, i) => ms.set(pos - 1, { end: pos - 1 + q.length, mi: i }));
  lastMS = ms;
}

function scrollCur() {
  const el = document.querySelector('mark.cur');
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function renderBanner() {
  const b = $('bbanner');
  if (loaded >= serverMax) {
    b.style.display = 'flex';
    b.innerHTML = `<span class="bb-info">✓ ${fn(serverMax)} decimales calculados — límite del servidor</span>`;
    return;
  }
  const next = Math.min(loaded + CHUNK_COUNT, serverMax);
  b.style.display = 'flex';
  b.innerHTML = `
    <span class="bb-info">
      Mostrando <strong>${fn(loaded)}</strong> de <strong>${fn(serverMax)}</strong> decimales disponibles
    </span>
    <button class="bo" style="font-size:.52rem;padding:7px 10px;min-height:36px"
      onclick="loadBlockAndRefresh()" ${busy ? 'disabled' : ''}>
      CARGAR TODO (+${fn(serverMax - loaded)})
    </button>`;
}

/* ════════════════════════════════════════════════
   API / SERVIDOR
════════════════════════════════════════════════ */
async function detectMode() {
  try {
    const r = await fetch('/api/status', { signal: AbortSignal.timeout(2000) });
    if (!r.ok) throw new Error();
    const d = await r.json();
    serverMax       = d.currentMax || d.maxDigits || 100_000;
    serverHardLimit = d.hardLimit   || 50_000_000;
    serverRamGB     = d.ramGB       || null;
    updateMaxBtn();
    serverMode = true;
    return true;
  } catch {
    serverMode = false;
    return false;
  }
}

async function waitServerReady() {
  for (let i = 0; i < 60; i++) {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      if (d.ready) {
        serverMax       = d.currentMax || d.totalDigits;
        serverHardLimit = d.hardLimit  || serverHardLimit;
        serverRamGB     = d.ramGB      || null;
        updateMaxBtn();
        return true;
      }
    } catch {}
    setStatus('go', 'SERVIDOR…');
    $('hsub').textContent = `Servidor calculando π… (${i * 5}s)`;
    await sleep(5000);
  }
  return false;
}

async function loadFromServer(start, count) {
  const r = await fetch(`/api/pi?start=${start}&count=${count}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return (await r.json()).decimals;
}

async function searchOnServer(q) {
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.json();
}

/* ════════════════════════════════════════════════
   WEB WORKER (modo standalone — Machin BigInt)
════════════════════════════════════════════════ */
const WORKER_SRC = `
function arctan(x,prec){
  const S=10n**BigInt(prec+20),x2=BigInt(x*x);
  let term=S/BigInt(x),sum=term,neg=true,k=3n;
  while(true){term=term/x2;if(term===0n)break;const d=term/k;if(d===0n)break;
    if(neg)sum-=d;else sum+=d;neg=!neg;k+=2n;}
  return sum;
}
self.onmessage=function(e){
  const{start,end}=e.data,prec=end+5;
  self.postMessage({type:'s',msg:'arctan(1/5)…'});
  const t5=arctan(5,prec);
  self.postMessage({type:'s',msg:'arctan(1/239)…'});
  const t239=arctan(239,prec);
  self.postMessage({type:'s',msg:'combinando…'});
  const S=10n**BigInt(prec+20),piS=4n*(4n*t5-t239);
  const piI=piS*(10n**BigInt(end))/S;
  const s=piI.toString();
  self.postMessage({type:'done',chunk:s.slice(1).slice(start,end)});
};`;

function makeWorker() {
  return new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'application/javascript' })));
}
function calcBlock(upTo) {
  return new Promise((res, rej) => {
    if (worker) { try { worker.terminate(); } catch(_) {} }
    worker = makeWorker();
    worker.onmessage = e => {
      if (e.data.type === 'done') { worker.terminate(); worker = null; res(e.data.chunk); }
    };
    worker.onerror = e => { worker.terminate(); worker = null; rej(e); };
    worker.postMessage({ start: loaded, end: upTo });
  });
}

/* ════════════════════════════════════════════════
   CARGA DE BLOQUES
════════════════════════════════════════════════ */
async function loadNextBlock() {
  if (busy || loaded >= serverMax) return false;
  busy = true;
  $('bbuscar').disabled = true;
  const upTo = Math.min(loaded + CHUNK_COUNT, serverMax);
  try {
    let chunk;
    if (serverMode) chunk = await loadFromServer(loaded, upTo - loaded);
    else            chunk = await calcBlock(upTo);
    piDec  += chunk;
    loaded  = upTo;
    updateFooter();
    busy = false;
    $('bbuscar').disabled = false;
    return true;
  } catch(e) {
    busy = false;
    $('bbuscar').disabled = false;
    return false;
  }
}

async function loadBlockAndRefresh() {
  const ok = await loadNextBlock();
  if (ok) { renderText(lastMS, mIdx); renderBanner(); }
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
async function init() {
  setStatus('go', '…');
  const isServer = await detectMode();

  if (isServer) {
    setStatus('go', 'SERVIDOR…');
    $('hsub').textContent = 'Esperando cálculo del servidor…';
    const ok = await waitServerReady();
    if (!ok) { setStatus('err', 'ERROR'); $('hsub').textContent = 'Servidor no responde'; return; }
    try {
      const chunk = await loadFromServer(0, INIT_COUNT);
      piDec = chunk; loaded = INIT_COUNT;
      updateFooter(); renderText(); renderBanner(); activateUI();
    } catch(e) { setStatus('err', 'ERROR'); $('pt').textContent = '⚠ ' + e.message; }
  } else {
    serverMax = 500_000;
    $('hsub').textContent = 'Calculando π localmente…';
    try {
      const chunk = await calcBlock(INIT_COUNT);
      piDec = chunk; loaded = INIT_COUNT;
      updateFooter(); renderText(); renderBanner(); activateUI();
    } catch(e) { setStatus('err', 'ERROR'); $('pt').textContent = '⚠ ' + e.message; }
  }
}

/* ════════════════════════════════════════════════
   BÚSQUEDA — automática por bloques
════════════════════════════════════════════════ */
async function buscar() {
  const q = $('q').value.trim().replace(/\D/g, '');
  if (!q || busy) return;

  lastQ   = q;
  matches = [];
  mIdx    = 0;
  lastMS  = null;

  // Mostrar modal de búsqueda
  showSearchModal('BUSCANDO EN π', `Buscando «${q}»…`);

  let searchedDec = 0;

  if (serverMode) {
    // ── Modo servidor: búsqueda completa en el servidor de una vez ──
    updateSearchModal(`Consultando ${fn(serverMax)} decimales en el servidor…`);
    try {
      const res = await searchOnServer(q);
      matches    = res.positions;
      searchedDec = serverMax;

      // Si hay resultados, asegurar que los decimales hasta la 1ª pos están cargados
      if (matches.length > 0 && matches[0] > loaded) {
        const needed = Math.ceil(matches[0] / CHUNK_COUNT) * CHUNK_COUNT;
        const upTo   = Math.min(needed, serverMax);
        updateSearchModal(`Cargando decimales hasta posición ${fn(matches[0])}…`);
        while (loaded < upTo) {
          const chunk = await loadFromServer(loaded, Math.min(CHUNK_COUNT, upTo - loaded));
          piDec += chunk; loaded += chunk.length;
        }
        updateFooter();
      }
    } catch(e) {
      // fallback local
      let i = 0;
      while ((i = piDec.indexOf(q, i)) !== -1) { matches.push(i + 1); i++; }
      searchedDec = loaded;
    }
  } else {
    // ── Modo standalone: buscar bloque a bloque hasta encontrar ──
    let blockNum = 0;
    const totalBlocks = Math.ceil(serverMax / CHUNK_COUNT);

    while (true) {
      blockNum++;
      // Buscar en lo cargado
      const searchFrom = Math.max(0, searchedDec - q.length + 1);
      let i = searchFrom;
      while ((i = piDec.indexOf(q, i)) !== -1) { matches.push(i + 1); i++; }
      searchedDec = loaded;

      const pct = Math.round(loaded / serverMax * 100);
      updateSearchModal(`Bloque ${blockNum}/${totalBlocks} · ${fn(loaded)} decimales · ${pct}%`);
      $('ms-bar').style.width = pct + '%';

      // Si encontramos algo → parar
      if (matches.length > 0) break;
      // Si no hay más → parar
      if (loaded >= serverMax) break;
      // Cargar siguiente bloque
      const ok = await loadNextBlock();
      if (!ok) break;
    }
  }

  hideSearchModal();
  setStatus('ok', 'LISTO');

  // Renderizar marcas en el display
  buildMS(q);
  renderText(lastMS, 0);
  renderBanner();

  // Mostrar modal de resultados
  showResult(q, matches, searchedDec);
}

/* ════════════════════════════════════════════════
   ENTER
════════════════════════════════════════════════ */
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

/* ════════════════════════════════════════════════
   EXPANSIÓN DINÁMICA DE π
════════════════════════════════════════════════ */
let expandPollTimer = null;
let meBarPct = 3;
let meBarTimer = null;

async function expandPi() {
  if (!serverMode) return;
  const btn = $('btn-expand');
  btn.disabled = true;

  try {
    const r = await fetch('/api/expand', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) {
      alert(d.error || 'Error al expandir');
      btn.disabled = false;
      return;
    }
    // Mostrar modal
    $('me-from').textContent = fn(d.from) + ' dec.';
    $('me-to').textContent   = fn(d.newTarget) + ' dec.';
    $('me-bar').style.width  = '3%';
    $('me-detail').innerHTML = 'Calculando con algoritmo Chudnovsky…<br>El servidor continúa disponible durante el cálculo.';
    $('modal-expand').classList.add('show');
    btn.classList.add('expanding');
    btn.textContent = 'CALCULANDO…';

    // Barra de progreso falsa (el cálculo no reporta %)
    meBarPct = 3;
    clearInterval(meBarTimer);
    meBarTimer = setInterval(() => {
      meBarPct = Math.min(92, meBarPct + (meBarPct < 60 ? 0.6 : 0.05));
      $('me-bar').style.width = meBarPct + '%';
    }, 500);

    // Polling hasta que el servidor termine
    startExpandPoll(d.newTarget);
  } catch(e) {
    alert('Error de red: ' + e.message);
    btn.disabled = false;
  }
}

function startExpandPoll(target) {
  clearInterval(expandPollTimer);
  let elapsed = 0;
  expandPollTimer = setInterval(async () => {
    elapsed += 5;
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      $('me-detail').innerHTML =
        `Calculando con algoritmo Chudnovsky…<br>` +
        `${fn(d.currentMax || 0)} / ${fn(target)} decimales · ${elapsed}s transcurridos`;

      if (!d.expanding && d.currentMax >= target) {
        // ¡Terminó!
        clearInterval(expandPollTimer);
        clearInterval(meBarTimer);
        $('me-bar').style.width = '100%';
        $('me-detail').innerHTML =
          `✓ <strong style="color:var(--g)">${fn(target)}</strong> decimales disponibles.<br>` +
          `Cargando en el display…`;

        // Actualizar estado local
        serverMax = target;
        updateFooter();

        // Cargar los nuevos decimales
        await loadNewDecimals(target);

        setTimeout(() => {
          closeExpandModal();
          renderBanner();
          const btn = $('btn-expand');
          btn.classList.remove('expanding');
          btn.textContent = '+500K';
          btn.disabled = serverMax >= 50_000_000;
        }, 1200);
      }
    } catch(e) { /* red ocupada, reintentar */ }
  }, 5000);
}

async function loadNewDecimals(target) {
  // Cargar los decimales que aún no tenemos
  if (loaded >= target) return;
  try {
    const chunk = await loadFromServer(loaded, target - loaded);
    piDec  += chunk;
    loaded  = target;
    updateFooter();
    renderText(lastMS, mIdx);
    renderBanner();
  } catch(e) { console.error('Error cargando nuevos decimales:', e); }
}

async function expandPiMax() {
  if (!serverMode) return;
  const target = serverHardLimit;
  if (serverMax >= target) return;
  const diff = target - serverMax;
  const ramInfo = serverRamGB ? ` (RAM del servidor: ${serverRamGB} GB)` : '';
  if (!confirm(`¿Calcular hasta ${fn(target)} decimales de π?\n\nEsto añadirá ${fn(diff)} decimales${ramInfo}.\nEl cálculo puede tardar varias horas según el hardware.\n\nEl servidor seguirá disponible durante el proceso.`)) return;

  const btn = $('btn-expand-max');
  btn.disabled = true;
  $('btn-expand').disabled = true;

  try {
    // Llamar a expand repetidamente en background — el servidor suma de 500K en 500K
    // pero mostramos el modal con el target final directamente
    const r = await fetch('/api/expand', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) { alert(d.error || 'Error'); btn.disabled = false; $('btn-expand').disabled = false; return; }

    $('me-from').textContent = fn(serverMax) + ' dec.';
    $('me-to').textContent   = fn(target) + ' dec.';
    $('me-bar').style.width  = '1%';
    $('me-detail').innerHTML = 'Calculando 50.000.000 decimales con Chudnovsky…<br>Esto puede tardar varias horas. Puedes cerrar esta ventana, el cálculo continúa en el servidor.';
    $('modal-expand').classList.add('show');
    btn.classList.add('expanding');
    btn.textContent = 'CALCULANDO…';

    meBarPct = 1;
    clearInterval(meBarTimer);
    meBarTimer = setInterval(() => {
      meBarPct = Math.min(98, meBarPct + 0.02);
      $('me-bar').style.width = meBarPct + '%';
    }, 1000);

    // Polling — pero el servidor solo expande de 500K en 500K,
    // así que necesitamos seguir pidiendo expansiones hasta llegar a 50M
    startExpandPollMax(target);
  } catch(e) {
    alert('Error de red: ' + e.message);
    btn.disabled = false; $('btn-expand').disabled = false;
  }
}

function startExpandPollMax(finalTarget) {
  clearInterval(expandPollTimer);
  let elapsed = 0;
  expandPollTimer = setInterval(async () => {
    elapsed += 5;
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      const cur = d.currentMax || 0;
      const pct = Math.round(cur / finalTarget * 100);
      $('me-detail').innerHTML =
        `Calculando con Chudnovsky…<br>` +
        `${fn(cur)} / ${fn(finalTarget)} decimales · ${elapsed}s · ${pct}%`;
      $('me-bar').style.width = Math.max(1, pct) + '%';

      if (!d.expanding && cur < finalTarget) {
        // Pedir siguiente bloque de 500K
        await fetch('/api/expand', { method: 'POST' }).catch(() => {});
      }

      if (!d.expanding && cur >= finalTarget) {
        clearInterval(expandPollTimer);
        clearInterval(meBarTimer);
        $('me-bar').style.width = '100%';
        $('me-detail').innerHTML =
          `✓ <strong style="color:var(--g)">${fn(finalTarget)}</strong> decimales disponibles.<br>Cargando en el display…`;
        serverMax = finalTarget;
        updateFooter();
        await loadNewDecimals(finalTarget);
        setTimeout(() => {
          closeExpandModal();
          renderBanner();
          $('btn-expand-max').classList.remove('expanding');
          $('btn-expand-max').textContent = '+50M';
          $('btn-expand-max').disabled = serverMax >= serverHardLimit;
          $('btn-expand').disabled     = serverMax >= serverHardLimit;
        }, 1200);
      }
    } catch(e) {}
  }, 5000);
}

function updateMaxBtn() {
  const lbl = $('btn-max-label');
  if (lbl) {
    if (serverHardLimit >= 1_000_000_000) lbl.textContent = '+1B';
    else if (serverHardLimit >= 1_000_000) lbl.textContent = '+' + Math.round(serverHardLimit/1_000_000) + 'M';
    else lbl.textContent = '+' + fn(serverHardLimit);
  }
  const btnMax = $('btn-expand-max');
  if (btnMax) btnMax.title = `Calcular hasta ${fn(serverHardLimit)} decimales (límite según RAM del servidor)`;
}

function closeExpandModal() {
  $('modal-expand').classList.remove('show');
}

function scrollTop() {
  const pc = $('pc');
  pc.scrollTo({ top: 0, behavior: 'smooth' });
  // Limpiar resaltados y volver al inicio visual
  if (lastMS) { lastMS = null; renderText(); }
}

init();
</script>
</body>
</html>
