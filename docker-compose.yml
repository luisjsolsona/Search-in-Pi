version: "3.8"

# ═══════════════════════════════════════════════════════════
#  Search-in-Pi — docker-compose
#  Compatible con CasaOS (importar como App personalizada)
# ═══════════════════════════════════════════════════════════

services:
  search-in-pi:
    image: ghcr.io/luisjsolsona/search-in-pi:latest
    # O construir localmente:
    # build: .
    container_name: search-in-pi
    restart: unless-stopped

    ports:
      - "3141:3141"   # Puerto π :)

    environment:
      # Puerto interno del servidor
      - PORT=3141
      # Decimales de π a calcular al arrancar.
      # Valores recomendados según RAM disponible:
      #   100000  →  ~256MB RAM, ~5s cálculo
      #   500000  →  ~1GB RAM,   ~60s cálculo
      #   1000000 →  ~2GB RAM,   ~4min cálculo
      - MAX_DIGITS=100000
      - NODE_ENV=production

    # CasaOS muestra estas etiquetas en la interfaz
    labels:
      - "casaos.author=luisjsolsona"
      - "casaos.category=Utilities"
      - "casaos.description=Buscador de secuencias numéricas en los decimales de π. Calcula hasta 1.000.000 decimales con el algoritmo Chudnovsky."
      - "casaos.hostname=search-in-pi"
      - "casaos.icon=https://raw.githubusercontent.com/luisjsolsona/Search-in-Pi/main/public/icon.svg"
      - "casaos.index=/index.html"
      - "casaos.port_map=3141"
      - "casaos.scheme=http"
      - "casaos.title=Search in Pi"
      - "casaos.tips.before_install=Ajusta MAX_DIGITS según tu RAM disponible. 100000 = mínimo recomendado."

    # Límites de recursos (ajusta según tu servidor)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3141/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm/v7
  main: search-in-pi
  scheme: http
  index: /index.html
  port_map: "3141"
  title:
    custom: Search in Pi
  icon: https://raw.githubusercontent.com/luisjsolsona/Search-in-Pi/main/public/icon.svg
  description:
    es_es: Buscador de secuencias numéricas en los decimales de π. Calcula hasta 1.000.000 decimales con el algoritmo Chudnovsky directamente en tu servidor.
    en_us: Search for numeric sequences in the decimals of π. Computes up to 1,000,000 decimal places using the Chudnovsky algorithm on your own server.
  tips:
    before_install:
      es_es: |
        Ajusta MAX_DIGITS según tu RAM disponible:
        • 100.000 → ~256MB RAM, ~5s de cálculo
        • 500.000 → ~1GB RAM, ~60s de cálculo
        • 1.000.000 → ~2GB RAM, ~4min de cálculo
