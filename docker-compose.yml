# ═══════════════════════════════════════════════════════════
#  Search-in-Pi — docker-compose
#  Compatible con CasaOS (importar como App personalizada)
# ═══════════════════════════════════════════════════════════

services:
  search-in-pi:
    build: .
    container_name: search-in-pi
    restart: unless-stopped

    ports:
      - "3141:3141"   # Puerto π :)

    environment:
      - PORT=3141
      # Decimales a calcular si NO hay caché en disco.
      # Con caché, arranca instantáneamente con todos los que haya guardados.
      - MAX_DIGITS=1000000
      - NODE_ENV=production
      # Ruta del caché dentro del contenedor (mapeada al volumen abajo)
      - PI_CACHE_PATH=/data/pi_cache.txt

    volumes:
      # Volumen persistente para el caché de π
      # En CasaOS: /DATA/AppData/search-in-pi/data → /data
      - /DATA/AppData/search-in-pi/data:/data

    # CasaOS muestra estas etiquetas en la interfaz
    labels:
      - "casaos.author=luisjsolsona"
      - "casaos.category=Utilities"
      - "casaos.description=Buscador de secuencias numéricas en los decimales de π."
      - "casaos.hostname=search-in-pi"
      - "casaos.icon=https://raw.githubusercontent.com/luisjsolsona/Search-in-Pi/main/public/icon.svg"
      - "casaos.index=/index.html"
      - "casaos.port_map=3141"
      - "casaos.scheme=http"
      - "casaos.title=Search in Pi"

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3141/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s   # Mucho más rápido si hay caché

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm/v7
  main: search-in-pi
  scheme: http
  index: /index.html
  port_map: "3141"
  title:
    custom: Search in Pi
  icon: https://raw.githubusercontent.com/luisjsolsona/Search-in-Pi/main/public/icon.svg
  description:
    es_es: Buscador de secuencias numéricas en los decimales de π con caché persistente.
    en_us: Search for numeric sequences in π decimals with persistent cache.
